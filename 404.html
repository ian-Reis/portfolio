<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ian Reis</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121A22'/%3E%3Cpath d='M18 32L46 20M18 32L46 44' stroke='%237FB5B0' stroke-width='3' fill='none'/%3E%3Ccircle cx='18' cy='32' r='6' fill='%23F2F4F3'/%3E%3Ccircle cx='46' cy='20' r='6' fill='%23F2F4F3'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%23F2F4F3'/%3E%3C/svg%3E">
<script>
  /* same theme and language as the portfolio (shared localStorage), before first paint */
  (function () {
    var r = document.documentElement;
    var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var theme = get('ir:theme');
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-theme', theme);
    var lang = get('ir:lang');
    if (lang !== 'en' && lang !== 'pt') lang = /^pt\b/i.test(navigator.language || '') ? 'pt' : 'en';
    r.lang = lang === 'pt' ? 'pt-BR' : 'en';
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('motion');
  })();
</script>
<style>
  /* works at any URL depth on GitHub Pages; falls back to the site root when served locally */
  @font-face {
    font-family: 'Geist'; font-weight: 100 900; font-display: swap;
    src: url('/portfolio/assets/fonts/geist.woff2') format('woff2'), url('/assets/fonts/geist.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono'; font-weight: 400 500; font-display: swap;
    src: url('/portfolio/assets/fonts/geist-mono.woff2') format('woff2'), url('/assets/fonts/geist-mono.woff2') format('woff2');
  }
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

  :root {
    --paper: #F2F4F3; --surface: #FFFFFF; --ink: #121A22; --slate: #586671; --hairline: #D5DCDF;
    --hairline-strong: #B7C3C8; --port: #8FA0A8; --accent: #1B5E5A; --btn-bg: #121A22; --btn-fg: #F2F4F3;
    --dot: rgba(18, 26, 34, 0.18); --ease: cubic-bezier(0.215, 0.61, 0.355, 1);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #0E1418; --surface: #141C21; --ink: #E4EBE9; --slate: #93A3AB; --hairline: #243139;
    --hairline-strong: #34444E; --port: #5B6C75; --accent: #5FB3AA; --btn-bg: #E4EBE9; --btn-fg: #0E1418;
    --dot: rgba(228, 235, 233, 0.16);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
    font: 400 17px/1.6 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.6px); background-size: 24px 24px;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding-inline: clamp(20px, 5vw, 56px); }
  header { height: 64px; display: flex; align-items: center; }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: -0.015em; }
  main { flex: 1; display: flex; align-items: center; padding-block: 32px 72px; }
  .code { margin-top: 28px; font: 400 13px/1 'Geist Mono', ui-monospace, monospace; color: var(--slate); }
  h1 { max-width: 16ch; margin-top: 18px; font-size: clamp(40px, 7vw, 92px); font-weight: 300; line-height: 0.98; letter-spacing: -0.04em; text-wrap: balance; }
  p.lead { max-width: 46ch; margin-top: 22px; color: var(--slate); font-size: clamp(17px, 1.5vw, 19px); }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 46px; margin-top: 32px; padding: 0 22px;
    border-radius: 8px; background: var(--btn-bg); color: var(--btn-fg); font: 500 15.5px/1 inherit;
    transition: background-color 0.25s, color 0.25s;
  }
  .btn:hover { background: var(--accent); color: var(--paper); }

  /* the broken connection */
  .route { display: block; width: min(520px, 100%); height: auto; overflow: visible; }
  .route .box { fill: var(--surface); stroke: var(--hairline); stroke-width: 1; }
  .route .ghost { fill: none; stroke: var(--hairline-strong); stroke-width: 1; stroke-dasharray: 5 5; }
  .route .name { fill: var(--ink); font: 500 15px 'Geist', system-ui, sans-serif; }
  .route .meta { fill: var(--slate); font: 400 12px 'Geist Mono', ui-monospace, monospace; }
  .route .q { fill: var(--slate); font: 300 30px 'Geist', system-ui, sans-serif; }
  .route .edge { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .route .port { fill: var(--accent); }
  .route .port--off { fill: var(--paper); stroke: var(--port); stroke-width: 1.5; }
  .route .spark { stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; opacity: 0; }
  .motion .route .edge-a { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 0.7s var(--ease) 0.2s forwards, pull-a 0.6s var(--ease) 0.95s forwards; }
  .motion .route .edge-b { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 0.7s var(--ease) 0.2s forwards, pull-b 0.6s var(--ease) 0.95s forwards; }
  .motion .route .spark { animation: spark 0.9s var(--ease) 0.9s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pull-a { to { transform: translateX(-6px); } }
  @keyframes pull-b { to { transform: translateX(6px); } }
  @keyframes spark { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0.55; } }
  .motion .reveal { animation: up 0.8s var(--ease) both; }
  .motion .reveal:nth-child(2) { animation-delay: 0.08s; } .motion .reveal:nth-child(3) { animation-delay: 0.16s; }
  .motion .reveal:nth-child(4) { animation-delay: 0.24s; } .motion .reveal:nth-child(5) { animation-delay: 0.32s; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header class="wrap"><a class="brand" href="/portfolio/" data-home>Ian Reis</a></header>
  <main class="wrap">
    <div>
      <svg class="route reveal" viewBox="0 0 520 96" aria-hidden="true" focusable="false">
        <rect class="box" x="0.5" y="12.5" width="200" height="71" rx="10"/>
        <text class="name" x="20" y="43" data-t="here">You are here</text>
        <text class="meta" x="20" y="64" id="path">/</text>
        <circle class="port" cx="200.5" cy="48" r="5"/>
        <path class="edge edge-a" d="M206 48H262"/>
        <path class="edge edge-b" d="M276 48H333"/>
        <path class="spark" d="M269 36v-8M262 40l-5-5M276 40l5-5M269 60v8"/>
        <circle class="port port--off" cx="338.5" cy="48" r="5"/>
        <rect class="ghost" x="338.5" y="12.5" width="180" height="71" rx="10"/>
        <text class="q" x="420" y="58">?</text>
      </svg>
      <p class="code reveal" data-t="code">Error 404</p>
      <h1 class="reveal" data-t="title">This route doesn't connect to anything.</h1>
      <p class="lead reveal" data-t="lead">The page you asked for isn't here. It may have moved, or the link is wrong.</p>
      <a class="btn reveal" href="/portfolio/" data-home data-back>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-t="back">Back to the portfolio</span>
      </a>
    </div>
  </main>
<script>
  (function () {
    var pt = document.documentElement.lang === 'pt-BR';
    var T = {
      here: 'Você está aqui',
      code: 'Erro 404',
      title: 'Esta rota não leva a lugar nenhum.',
      lead: 'A página que você pediu não está aqui. Ela pode ter mudado de lugar, ou o link está errado.',
      back: 'Voltar ao portfólio',
    };
    if (pt) {
      document.title = 'Página não encontrada — Ian Reis';
      document.querySelectorAll('[data-t]').forEach(function (n) { if (T[n.dataset.t]) n.textContent = T[n.dataset.t]; });
    }
    // the requested path, shortened to fit the card
    var p = decodeURIComponent(location.pathname);
    document.getElementById('path').textContent = p.length > 24 ? p.slice(0, 23) + '…' : p;
    // GitHub Pages serves the site under /portfolio/; a local server serves it at /
    var home = location.pathname.indexOf('/portfolio/') === 0 ? '/portfolio/' : '/';
    document.querySelectorAll('[data-home]').forEach(function (a) { a.setAttribute('href', home); });
    // hand the click position to the portfolio, which opens itself as a circle from there
    document.querySelectorAll('[data-back], .brand').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var r = a.getBoundingClientRect();
        var x = e.clientX || r.left + r.width / 2;
        var y = e.clientY || r.top + r.height / 2;
        try { sessionStorage.setItem('ir:vt-origin', JSON.stringify({ x: Math.round(x), y: Math.round(y) })); } catch (err) {}
      });
    });
  })();
</script>
</body>
</html>
