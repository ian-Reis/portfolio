<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ian Reis</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315130F'/%3E%3Cpath d='M18 32L46 20M18 32L46 44' stroke='%23F2A04A' stroke-width='3' fill='none'/%3E%3Ccircle cx='18' cy='32' r='6' fill='%23F2F2F0'/%3E%3Ccircle cx='46' cy='20' r='6' fill='%23F2F2F0'/%3E%3Ccircle cx='46' cy='44' r='6' fill='%23F2F2F0'/%3E%3C/svg%3E">
<script>
  /* same theme and language as the portfolio (shared localStorage), before first paint */
  (function () {
    var r = document.documentElement;
    var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var theme = get('ir:theme');
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    r.setAttribute('data-theme', theme);
    var lang = get('ir:lang');
    if (lang !== 'en' && lang !== 'pt') lang = /^pt\b/i.test(navigator.language || '') ? 'pt' : 'en';
    r.lang = lang === 'pt' ? 'pt-BR' : 'en';
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('motion');
  })();
</script>
<style>
  /* works at any URL depth on GitHub Pages; falls back to the site root when served locally */
  @font-face {
    font-family: 'Geist'; font-weight: 100 900; font-display: swap;
    src: url('/portfolio/assets/fonts/geist.woff2') format('woff2'), url('/assets/fonts/geist.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Geist Mono'; font-weight: 400 500; font-display: swap;
    src: url('/portfolio/assets/fonts/geist-mono.woff2') format('woff2'), url('/assets/fonts/geist-mono.woff2') format('woff2');
  }
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

  :root {
    --paper: #F2F2F0; --surface: #FFFFFF; --ink: #15130F; --slate: #615B52; --hairline: #DDD9D2;
    --hairline-strong: #C2BCB2; --port: #A1998D; --accent: #A84B0C; --btn-bg: #15130F; --btn-fg: #F2F2F0;
    --dot: rgba(18, 26, 34, 0.18); --ease: cubic-bezier(0.215, 0.61, 0.355, 1);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #07080B; --surface: #0F1116; --ink: #EFE8DC; --slate: #A39C90; --hairline: #1F2129;
    --hairline-strong: #2F323B; --port: #6E685E; --accent: #F2A04A; --btn-bg: #EFE8DC; --btn-fg: #07080B;
    --dot: rgba(228, 235, 233, 0.16);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  * { margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
    font: 400 17px/1.6 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.6px); background-size: 24px 24px;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding-inline: clamp(20px, 5vw, 56px); }
  header { height: 64px; display: flex; align-items: center; }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: -0.015em; }
  main { flex: 1; display: flex; align-items: center; padding-block: 32px 72px; }
  .code { margin-top: 28px; font: 400 13px/1 'Geist Mono', ui-monospace, monospace; color: var(--slate); }
  h1 { max-width: 16ch; margin-top: 18px; font-size: clamp(40px, 7vw, 92px); font-weight: 300; line-height: 0.98; letter-spacing: -0.04em; text-wrap: balance; }
  p.lead { max-width: 46ch; margin-top: 22px; color: var(--slate); font-size: clamp(17px, 1.5vw, 19px); }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 46px; margin-top: 32px; padding: 0 22px;
    border-radius: 8px; background: var(--btn-bg); color: var(--btn-fg); font: 500 15.5px/1 inherit;
    transition: background-color 0.25s, color 0.25s;
  }
  .btn:hover { background: var(--accent); color: var(--paper); }

  /* the black hole this page fell into: ASCII, computed once, animated cheaply */
  .hole { display: block; width: min(640px, 100%); height: clamp(220px, 34vh, 320px); }
  .motion .reveal { animation: up 0.8s var(--ease) both; }
  .motion .reveal:nth-child(2) { animation-delay: 0.08s; } .motion .reveal:nth-child(3) { animation-delay: 0.16s; }
  .motion .reveal:nth-child(4) { animation-delay: 0.24s; } .motion .reveal:nth-child(5) { animation-delay: 0.32s; }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header class="wrap"><a class="brand" href="/portfolio/" data-home>Ian Reis</a></header>
  <main class="wrap">
    <div>
      <canvas class="hole reveal" id="hole" aria-hidden="true"></canvas>
      <p class="code reveal" data-t="code">Error 404</p>
      <h1 class="reveal" data-t="title">This page crossed the event horizon.</h1>
      <p class="lead reveal" data-t="lead">Whatever was at this address fell in, and nothing comes back out. It may have moved, or the link is wrong.</p>
      <a class="btn reveal" href="/portfolio/" data-home data-back>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-t="back">Escape back to the portfolio</span>
      </a>
    </div>
  </main>
<script>
  (function () {
    var pt = document.documentElement.lang === 'pt-BR';
    var T = {
      code: 'Erro 404',
      title: 'Esta página cruzou o horizonte de eventos.',
      lead: 'O que havia neste endereço caiu, e nada volta de lá. Talvez tenha mudado de lugar, ou o link esteja errado.',
      back: 'Escapar de volta ao portfólio',
    };
    if (pt) {
      document.title = 'Página não encontrada — Ian Reis';
      document.querySelectorAll('[data-t]').forEach(function (n) { if (T[n.dataset.t]) n.textContent = T[n.dataset.t]; });
    }
    var p = decodeURIComponent(location.pathname);
    // GitHub Pages serves the site under /portfolio/; a local server serves it at /
    var home = location.pathname.indexOf('/portfolio/') === 0 ? '/portfolio/' : '/';
    document.querySelectorAll('[data-home]').forEach(function (a) { a.setAttribute('href', home); });
    // hand the click position to the portfolio, which opens itself as a circle from there
    document.querySelectorAll('[data-back], .brand').forEach(function (a) {
      a.addEventListener('click', function (e) {
        var r = a.getBoundingClientRect();
        var x = e.clientX || r.left + r.width / 2;
        var y = e.clientY || r.top + r.height / 2;
        try { sessionStorage.setItem('ir:vt-origin', JSON.stringify({ x: Math.round(x), y: Math.round(y) })); } catch (err) {}
        // escape velocity: the falling characters fly out first, then the page leaves
        if (window.__escape && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
          e.preventDefault();
          window.__escape();
          setTimeout(function () { location.href = a.getAttribute('href'); }, 380);
        }
      });
    });
    hole(p);
    // the cross-document transition may be skipped by the browser; that is fine, just not an error
    window.addEventListener('pageswap', function (e) {
      var vt = e.viewTransition;
      if (vt) { vt.ready.catch(function () {}); vt.finished.catch(function () {}); vt.updateCallbackDone.catch(function () {}); }
    });
  })();

  /* An ASCII black hole, computed once.
     Each character cell traces one light ray through Schwarzschild spacetime (photon orbit equation
     a = -1.5 h² r / |r|⁵) and the result is stored: where the ray crosses the accretion disk (radius, angle,
     Doppler factor), whether it falls in, how close it skims the photon sphere. Every frame then only turns
     the disk and picks characters, so the animation costs almost nothing. The path you typed spirals in. */
  function hole(path) {
    var cv = document.getElementById('hole');
    if (!cv || !cv.getContext) return;
    var g = cv.getContext('2d');
    var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var css = getComputedStyle(document.documentElement);
    var accent = css.getPropertyValue('--accent').trim();
    var RAMP = ' .:-=+*#%@';
    var D = 22, INCL = 0.3, RIN = 3, ROUT = 12;
    var W, H, CW, CH, cols, rows, hx, hy, P, shadowPx, cells = [];
    var burst = 0, t0 = performance.now();

    function hash(x, y) { var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
    function noise(x, y) {
      var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      var a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    }
    function fbm(x, y) { return 0.55 * noise(x, y) + 0.3 * noise(x * 2.1 + 5, y * 2.1 + 3) + 0.15 * noise(x * 4.3 + 9, y * 4.3 + 1); }
    // temperature to colour: deep red, orange, gold, white
    function bb(t) {
      t = Math.max(0, Math.min(1.3, t));
      if (t < 0.35) return [0.42 + 0.58 * t / 0.35, 0.03 + 0.27 * t / 0.35, 0.03 * t / 0.35];
      if (t < 0.68) { var k = (t - 0.35) / 0.33; return [1, 0.3 + 0.38 * k, 0.03 + 0.25 * k]; }
      var m = Math.min(1, (t - 0.68) / 0.34); return [1, 0.68 + 0.27 * m, 0.28 + 0.58 * m];
    }

    function trace() {
      var ci = Math.cos(INCL), si = Math.sin(INCL);
      var cam = [0, si * D, ci * D];
      var fwd = [0, -si, -ci];
      var up = [0, ci, -si]; // right × fwd
      cells = [];
      for (var j = 0; j < rows; j++) {
        for (var i = 0; i < cols; i++) {
          var sx = ((i + 0.5) * CW - hx) / P, sy = -((j + 0.5) * CH - hy) / P;
          var d = [fwd[0] + sx, fwd[1] + up[1] * sy, fwd[2] + up[2] * sy];
          var l = Math.hypot(d[0], d[1], d[2]); d = [d[0] / l, d[1] / l, d[2] / l];
          var p = cam.slice(), v = d.slice();
          var hv = [p[1] * v[2] - p[2] * v[1], p[2] * v[0] - p[0] * v[2], p[0] * v[1] - p[1] * v[0]];
          var h2 = hv[0] * hv[0] + hv[1] * hv[1] + hv[2] * hv[2];
          var cell = { hits: [], fall: false, rmin: 99, star: hash(i * 1.3, j * 7.1) > 0.965 ? hash(i, j + 3) : 0 };
          if (Math.sqrt(h2) < 17) {
            for (var n = 0; n < 220; n++) {
              var r2 = p[0] * p[0] + p[1] * p[1] + p[2] * p[2], r = Math.sqrt(r2);
              if (r < cell.rmin) cell.rmin = r;
              if (r < 1) { cell.fall = true; break; }
              if (r > 40 && p[0] * v[0] + p[1] * v[1] + p[2] * v[2] > 0) break;
              var dt = Math.max(0.03, Math.min(2.2, (r - 1) * 0.15));
              var k = -1.5 * h2 / (r2 * r2 * r) * dt;
              v = [v[0] + p[0] * k, v[1] + p[1] * k, v[2] + p[2] * k];
              var np = [p[0] + v[0] * dt, p[1] + v[1] * dt, p[2] + v[2] * dt];
              if (p[1] * np[1] < 0 && cell.hits.length < 3) {
                var f = p[1] / (p[1] - np[1]);
                var hx3 = p[0] + (np[0] - p[0]) * f, hz3 = p[2] + (np[2] - p[2]) * f;
                var rr = Math.hypot(hx3, hz3);
                if (rr > RIN * 0.92 && rr < ROUT) {
                  // Doppler: the gas moving towards us is brighter
                  var vl = Math.hypot(v[0], v[1], v[2]);
                  var beta = Math.sqrt(0.5 / rr), gam = 1 / Math.sqrt(1 - beta * beta);
                  var cosT = (hz3 * v[0] - hx3 * v[2]) / (rr * vl);
                  var gD = 1 / (gam * (1 - beta * cosT)) * Math.sqrt(1 - 1 / rr);
                  cell.hits.push([rr, Math.atan2(hz3, hx3), gD]);
                }
              }
              p = np;
            }
            if (!cell.fall && Math.hypot(p[0], p[1], p[2]) < 4) cell.fall = true;
          }
          if (Math.sqrt(h2) < 2.598) cell.fall = true;
          cells.push(cell);
        }
      }
    }

    function layout() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.font = '500 12px "Geist Mono", ui-monospace, monospace';
      CW = g.measureText('M').width || 7.2; CH = 14;
      cols = Math.floor(W / CW); rows = Math.floor(H / CH);
      hx = W / 2; hy = H * 0.5;
      shadowPx = Math.min(H * 0.17, W * 0.085);
      P = shadowPx / (2.598 / D);
      trace();
    }

    function colour(rgb, L) {
      var m = Math.max(rgb[0], rgb[1], rgb[2], 0.001), k = Math.min(1, L * 1.25);
      var c = rgb.map(function (x) { return x / m; });
      if (!dark) c = c.map(function (x) { return Math.pow(x, 1.7) * (0.6 - 0.24 * k); });
      else c = c.map(function (x) { return x * (0.42 + 0.58 * k); });
      return 'rgb(' + c.map(function (x) { return Math.round(x * 255); }).join(',') + ')';
    }

    function draw(now) {
      var t = (now - t0) / 1000;
      g.clearRect(0, 0, W, H);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '500 12px "Geist Mono", ui-monospace, monospace';
      for (var j = 0; j < rows; j++) {
        for (var i = 0; i < cols; i++) {
          var c = cells[j * cols + i], col = [0, 0, 0], a = 0;
          for (var h = 0; h < c.hits.length; h++) {
            var rr = c.hits[h][0], ph = c.hits[h][1], gD = c.hits[h][2];
            var ang = ph - 2.6 * Math.pow(rr, -1.5) * t;
            var n = fbm(Math.cos(ang) * rr * 0.85 + 7, Math.sin(ang) * rr * 0.85 + 3) * (0.7 + 0.3 * Math.sin(rr * 5.5));
            var prof = Math.pow(RIN / rr, 1.2) * Math.min(1, (rr - RIN * 0.92) / 1.1) * Math.min(1, (ROUT - rr) / 5);
            var I = prof * (0.3 + 1.35 * n * n) * Math.pow(gD, 3.5) * 2;
            var rgb = bb(Math.pow(RIN / rr, 0.75) * (0.78 + 0.45 * n) * gD);
            for (var q = 0; q < 3; q++) col[q] += (1 - a) * rgb[q] * I;
            a += (1 - a) * Math.min(1, prof * (0.5 + n) * 1.6);
          }
          if (!c.fall) {
            var ring = Math.exp(-Math.max(c.rmin - 1.5, 0) * 6);
            var ringRgb = bb(1);
            for (var q2 = 0; q2 < 3; q2++) col[q2] += (1 - a) * ringRgb[q2] * ring * 0.45;
            if (c.star && a < 0.5) { var s = 0.25 + 0.5 * c.star * (0.6 + 0.4 * Math.sin(t * 1.3 + c.star * 50)); col = [col[0] + s, col[1] + s * 0.92, col[2] + s * 0.85]; }
          }
          col = col.map(function (x) { return 1 - Math.exp(-x * 1.35); });
          var L = Math.max(col[0], col[1], col[2]);
          var idx = Math.floor(Math.min(0.999, Math.pow(L, 0.75)) * 10);
          if (!idx) continue;
          g.fillStyle = colour(col, L);
          g.fillText(RAMP[idx], (i + 0.5) * CW, (j + 0.5) * CH);
        }
      }
      // the address you typed, falling in along the disk (and flung out when you escape)
      var chars = Array.from(path.length > 40 ? path.slice(0, 39) + '…' : path);
      g.font = '600 13px "Geist Mono", ui-monospace, monospace';
      g.fillStyle = accent;
      for (var k = 0; k < chars.length; k++) {
        var life = ((t / 7) + (k / chars.length) * 0.9) % 1;
        var pr = burst ? 1 + burst * 3 : 1;
        var rad = (shadowPx * 1.05 + (W * 0.42) * Math.pow(1 - life, 1.4)) * pr;
        var an = k * 0.7 + life * life * 9 + t * 0.2;
        g.globalAlpha = Math.min(1, (1 - life) * 4) * Math.min(1, life * 6) * (burst ? 1 - burst : 1);
        g.fillText(chars[k], hx + Math.cos(an) * rad, hy + Math.sin(an) * rad * Math.sin(INCL) * 1.6);
      }
      g.globalAlpha = 1;
    }

    var running = false;
    function loop(now) {
      if (burst) burst = Math.min(1, burst + 0.06);
      draw(now);
      if (!reduced) requestAnimationFrame(loop); else running = false;
    }
    window.__escape = reduced ? null : function () { burst = 0.01; };
    var start = function () { layout(); if (!running) { running = true; requestAnimationFrame(loop); } };
    if (document.fonts && document.fonts.load) document.fonts.load('500 12px "Geist Mono"').then(start, start); else start();
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(layout, 150); });
  }
</script>

</body>
